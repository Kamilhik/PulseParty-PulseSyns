name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cloudflare/**
      - server/**
      - shared/**
      - web/**
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the CLOUDFLARE_API_TOKEN Actions secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set the CLOUDFLARE_ACCOUNT_ID Actions variable'; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check deployed health
        run: node --input-type=module -e "const r=await fetch('https://pulseparty.pulseparty.workers.dev/v1/health'); const h=await r.json(); if(!r.ok || h.ok!==true || h.protocol!==1) throw new Error('Deployment health check failed'); console.log('PulseParty HTTPS service is healthy');"
